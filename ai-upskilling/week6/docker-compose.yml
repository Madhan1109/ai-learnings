version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: lms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  user-service:
    build: ./ai-lms-parent/user-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/lms_user
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres

  course-service:
    build: ./ai-lms-parent/course-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/lms_course
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres

  enrollment-service:
    build: ./ai-lms-parent/enrollment-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/lms_enrollment
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

  assessment-service:
    build: ./ai-lms-parent/assessment-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - rabbitmq
      - redis
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/lms_assessment
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

  notification-service:
    build: ./ai-lms-parent/notification-service
    ports:
      - "8085:8085"
    depends_on:
      - redis
      - rabbitmq
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

  api-gateway:
    build: ./ai-lms-parent/api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - course-service
      - enrollment-service
      - assessment-service
      - notification-service

  prometheus:
    image: prom/prometheus:latest
    container_name: lms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: lms-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata: 