spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/auth/**
        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/courses/**
        - id: enrollment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/enrollments/**, /api/progress/**
        - id: assessment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/quizzes/**, /api/questions/**
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**, /ws/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true 