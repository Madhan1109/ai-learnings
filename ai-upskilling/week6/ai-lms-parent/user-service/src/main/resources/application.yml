spring:
  application:
    name: user-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/lms_user
    username: postgres
    password: postgres
  datasource:
    initialization-mode: always

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true 