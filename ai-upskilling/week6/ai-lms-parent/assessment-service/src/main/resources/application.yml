spring:
  application:
    name: assessment-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/lms_assessment
    username: postgres
    password: postgres
  datasource:
    initialization-mode: always
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true 