spring:
  application:
    name: course-service
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/lms_course
    username: postgres
    password: postgres
  datasource:
    initialization-mode: always

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true

course:
  content:
    upload-dir: uploads 