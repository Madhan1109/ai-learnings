server:
  port: 8082

spring:
  application:
    name: sales-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_system
    username: crm_user
    password: crm_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
  
  cloud:
    discovery:
      enabled: true
  
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
      cache-null-values: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/crm_system
  data:
    redis:
      host: redis
  eureka:
    client:
      service-url:
        defaultZone: http://eureka:8761/eureka/

# AI Service Configuration
ai:
  deal-scoring:
    enabled: true
    min-score: 0
    max-score: 100
  win-probability:
    enabled: true
  deal-velocity:
    enabled: true
  task-priority:
    enabled: true

# Logging Configuration
logging:
  level:
    com.crm.salesservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

 