server:
  port: 8083

spring:
  application:
    name: analytics-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_system
    username: crm_user
    password: crm_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
  
  cloud:
    discovery:
      enabled: true
  
  cache:
    type: redis
    redis:
      time-to-live: 900000 # 15 minutes
      cache-null-values: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/crm_system
  data:
    redis:
      host: redis
  eureka:
    client:
      service-url:
        defaultZone: http://eureka:8761/eureka/

# AI Analytics Configuration
ai:
  analytics:
    enabled: true
    confidence-threshold: 0.7
    data-points-threshold: 100
  ml:
    sales-trends:
      enabled: true
      prediction-days: 30
    customer-segmentation:
      enabled: true
      segments: 3
    churn-prediction:
      enabled: true
      risk-threshold: 0.7
    revenue-forecast:
      enabled: true
      forecast-months: 3

# Logging Configuration
logging:
  level:
    com.crm.analyticsservice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE



# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always 