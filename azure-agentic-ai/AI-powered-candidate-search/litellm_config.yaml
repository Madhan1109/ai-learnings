# LitELLM Gateway Configuration
# This enables unified LLM access and routing

model_list:
  - model_name: gpt-4-turbo-preview
    litellm_params:
      model: azure/gpt-4-turbo
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: "2024-02-15-preview"
  
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: azure/gpt-35-turbo
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_version: "2024-02-15-preview"

litellm_settings:
  drop_params: true
  set_verbose: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  
  # Rate limiting
  num_retries: 3
  timeout: 60
  
  # Caching
  cache:
    type: redis
    host: localhost
    port: 6379
    ttl: 3600

# Router settings
router_settings:
  routing_strategy: "simple-shuffle"
  allowed_fails: 2
  cooldown_time: 60

# Monitoring
monitoring:
  enabled: true
  provider: "prometheus"
  metrics_port: 4001

