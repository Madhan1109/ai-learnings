# Azure AI Services Configuration for Real Services
# This profile activates real Azure services instead of mock services
# To use this profile, run with: --spring.profiles.active=azure

# Azure AI Services Configuration (Real Services)
azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://your-resource.openai.azure.com/}
    api-key: ${AZURE_OPENAI_API_KEY:your-api-key}
    deployment-name: ${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4}
    max-tokens: 500  # Optimized for free tier (1000 tokens/month)
    temperature: 0.1  # Low temperature for medical accuracy
    timeout: 30s  # Request timeout
  
  form-recognizer:
    endpoint: ${AZURE_FORM_RECOGNIZER_ENDPOINT:https://your-resource.cognitiveservices.azure.com/}
    api-key: ${AZURE_FORM_RECOGNIZER_API_KEY:your-api-key}
    max-pages-per-month: 500  # Free tier limit
    timeout: 60s  # OCR processing can take longer
  
  search:
    endpoint: ${AZURE_SEARCH_ENDPOINT:https://your-search-service.search.windows.net}
    api-key: ${AZURE_SEARCH_API_KEY:your-api-key}
    index-name: medical-knowledge
    timeout: 10s  # Search should be fast

# Logging Configuration for Azure Services
logging:
  level:
    com.medical: DEBUG
    com.azure: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
